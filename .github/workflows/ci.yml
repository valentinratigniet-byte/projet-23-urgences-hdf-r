name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Tests (contrôles qualité, indicateurs, détection exacte du catalogue de défauts)
        run: Rscript scripts/tests.R

      - name: Simulation RPU reproductible (le fichier régénéré doit être identique au fichier versionné)
        run: |
          Rscript scripts/02_simuler_rpu.R
          git diff --exit-code --stat -- data/rpu_defauts_injectes.csv

      - name: Rendu des 16 rapports (panorama, départements, qualité, note ARS en PDF)
        run: Rscript scripts/03_rapports.R

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  publication:
    needs: rapports
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
